name: deploy

# Staged schema-infra deploy over GitHub OIDC (no stored AWS keys).
#
#   source: a lastdb merge that changes a Schema Service input moves the
#          `fold` pin through an auto-merged PR (auto-deploy-on-fold.yml).
#   dev  : automatic. Runs when the `ci-required` workflow finishes with
#          success on a push to main.
#   prod : automatic after that dev job. The dev job writes prod-eligible
#          only when dev deploy and dev smoke both pass, and only while
#          canonical-vocabulary/phase is prod. A workflow_dispatch with
#          target=prod and confirm_prod=deploy-prod does the same pair of
#          jobs. In that run the dev job classifies against the PROD base,
#          so DEV deploys and smokes what PROD gets even when DEV is current.
#
# Prod pins 5% of the live alias on the new version (CANARY_WEIGHT=0.05).
# canary-ticker.yml runs every 15 minutes. After 24 hours with alarms OK it
# promotes to 100%. An ALARM rolls the alias back to the previous version.
# The ticker reads the alias Description clock. A runner has no durable state file.
#
# A canary that still soaks keeps its full 24 hours. The prod job then changes
# nothing, records "prod deferred: canary soaking", and succeeds. After the
# promotion, canary-ticker.yml (scripts/deploy/prod-catch-up.sh) starts a
# target=prod run of this workflow for the newest main.
#
# DO NOT add an `environment:` key to any job. It changes the OIDC `sub`
# claim to `environment:<name>`. The IAM trust in
# cdk/lib/schema-infra-oidc-stack.ts matches the ref claim
# `repo:EdgeVector/schema-infra:ref:refs/heads/main` only, so the assume-role
# call would fail.
#
# Optional repository variable OBS_SENTRY_DSN: deploy.sh calls
# `gh variable get OBS_SENTRY_DSN` on prod. Do not put the value in a
# step env map. Do not invent a DSN. A failed or unset get leaves the
# Lambda DSN unset.
on:
  workflow_run:
    workflows: [ci-required]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "dev = dev only. prod = dev, then a 5% prod canary."
        type: choice
        options: [dev, prod]
        default: dev
      confirm_prod:
        description: "Type deploy-prod to allow target=prod."
        type: string
        default: ""
      force_kind:
        description: "Release classification (auto, infrastructure, or code-only)"
        type: choice
        options: ["auto", "infrastructure", "code-only"]
        default: "auto"
      revision:
        description: "Main commit (full sha) to deploy. Empty = the main tip. It must be on main and pass ci-required."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: read
  # A dispatch checks the ci-required result of its revision.
  checks: read

concurrency:
  group: schema-infra-deploy
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "152335099025"

jobs:
  deploy-dev:
    name: deploy-dev
    outputs:
      prod_eligible: ${{ steps.gate.outputs.eligible }}
      sha: ${{ steps.gate.outputs.sha }}
    # workflow_run: only a successful push run of ci-required on main.
    # workflow_dispatch: only from main (the OIDC trust is main-only), and
    # only for a main revision whose ci-required passed (the step below).
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
    steps:
      - name: Guard prod input
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod' && inputs.confirm_prod != 'deploy-prod'
        run: |
          echo "::error::target=prod needs confirm_prod=deploy-prod"
          exit 1
      # A dispatch skips the workflow_run CI condition above. Keep the same
      # gate: the revision is on main and its newest ci-required run passed.
      - name: Require a main revision that passed ci-required
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a full 40-hex commit sha"
            exit 1
          fi
          on_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/${DEPLOY_SHA}...main?per_page=1" --jq .status)"
          case "$on_main" in
            ahead|identical) ;;
            *) echo "::error::$DEPLOY_SHA is not on main (compare status: $on_main)"; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs?check_name=ci-required&per_page=100" \
            > "$RUNNER_TEMP/ci-required.json"
          if ! jq -e '[.check_runs[] | select(.name == "ci-required")] | max_by(.started_at)
              | .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ci-required.json" >/dev/null; then
            echo "::error::ci-required has not passed for $DEPLOY_SHA"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/SchemaInfraDeployDev
          aws-region: us-west-2
      - name: Restore last deployed oid
        env:
          GH_TOKEN: ${{ github.token }}
          LASTGIT_DEPLOY_LOG_DIR: ${{ runner.temp }}/deploy-state
          DEPLOY_ENV: dev
        run: bash scripts/deploy/restore-last-oid.sh
      - name: Restore the PROD base for a target=prod run
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          LASTGIT_DEPLOY_LOG_DIR: ${{ runner.temp }}/prod-base
          DEPLOY_ENV: prod
        run: bash scripts/deploy/restore-last-oid.sh
      - name: Deploy dev and smoke dev
        id: dev_pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LASTGIT_CI_OID: ${{ env.DEPLOY_SHA }}
          LASTGIT_DEPLOY_SKIP_PROD: "1"
          LASTGIT_DEPLOY_LOG_DIR: ${{ runner.temp }}/deploy-state
          SCHEMA_DEPLOY_BASE_FILE: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') && format('{0}/prod-base/last-deployed-oid', runner.temp) || '' }}
          SCHEMA_ARTIFACT_STORE: ${{ runner.temp }}/artifacts
          SCHEMA_BUILD_REMOTE_HOST: ""
          LASTGIT_DEPLOY_SKIP_SUBMODULE: "1"
          SCHEMA_DEPLOY_FORCE_KIND: ${{ inputs.force_kind }}
        run: bash .lastgit/deploy-pipeline.sh
      - name: DEV smoke passed ${{ env.DEPLOY_SHA }}
        if: steps.dev_pipeline.outputs.dev_smoke_revision == env.DEPLOY_SHA
        run: echo 'Actual DEV smoke passed for the selected source revision.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save dev last-deployed-oid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-deployed-oid-dev
          path: ${{ runner.temp }}/deploy-state/last-deployed-oid
          retention-days: 90
          if-no-files-found: ignore
      - name: Record prod eligibility
        id: gate
        if: success()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/deploy-state/prod-eligible"
          if [ -s "$f" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(tr -d '[:space:]' < "$f")" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the artifact for the prod job
        if: steps.gate.outputs.eligible == 'true' && (github.event_name == 'workflow_run' || inputs.target == 'prod')
        uses: actions/upload-artifact@v4
        with:
          name: schema-artifact
          path: ${{ runner.temp }}/artifacts
          retention-days: 1

  deploy-prod:
    name: deploy-prod
    concurrency:
      group: schema-infra-prod-traffic
      cancel-in-progress: false
    needs: deploy-dev
    if: >-
      needs.deploy-dev.outputs.prod_eligible == 'true'
      && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
        || (github.event_name == 'workflow_dispatch'
          && inputs.target == 'prod'
          && inputs.confirm_prod == 'deploy-prod'
          && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy-dev.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - uses: actions/download-artifact@v4
        with:
          name: schema-artifact
          path: ${{ runner.temp }}/artifacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/SchemaInfraDeployProd
          aws-region: us-east-1
      - name: Restore last deployed oid
        env:
          GH_TOKEN: ${{ github.token }}
          LASTGIT_DEPLOY_LOG_DIR: ${{ runner.temp }}/deploy-state
          DEPLOY_ENV: prod
        run: bash scripts/deploy/restore-last-oid.sh
      - name: Deploy prod (5% canary) and smoke prod
        id: prod_pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LASTGIT_CI_OID: ${{ needs.deploy-dev.outputs.sha }}
          SCHEMA_DEPLOY_SKIP_DEV: "1"
          CANARY_WEIGHT: "0.05"
          CANARY_SOAK_HOURS: "24"
          CANARY_STATE_FROM_ALIAS: "1"
          CANARY_RUN_ROOT_REFRESHED: "1"
          CANARY_SKIP_FETCH: "1"
          LASTGIT_DEPLOY_LOG_DIR: ${{ runner.temp }}/deploy-state
          SCHEMA_ARTIFACT_STORE: ${{ runner.temp }}/artifacts
          SCHEMA_BUILD_REMOTE_HOST: ""
          LASTGIT_DEPLOY_SKIP_SUBMODULE: "1"
          SCHEMA_DEPLOY_FORCE_KIND: ${{ inputs.force_kind }}
        run: bash .lastgit/deploy-pipeline.sh
      - name: PROD deferred while a canary soaks
        if: steps.prod_pipeline.outputs.prod_deferred == 'true'
        run: echo "PROD is unchanged. canary-ticker.yml starts the PROD catch-up after the promotion."
      - name: Save prod last-deployed-oid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-deployed-oid-prod
          path: ${{ runner.temp }}/deploy-state/last-deployed-oid
          if-no-files-found: ignore
          retention-days: 90
