name: teardown

# Retire the LastDB Schema Service in AWS (Tom, 2026-11-27).
#
# Replaces deploy.yml. On merge to main (after ci-required succeeds), or on a
# confirmed workflow_dispatch from main:
#   1. Refresh SchemaInfraOidcStack so deploy roles can empty/delete retained data
#   2. Tear down DEV (us-west-2)
#   3. Tear down PROD (us-east-1), including API domain schema.folddb.com
#   4. Delete SchemaInfraDeploy* roles; keep the shared GitHub OIDC provider
#
# DO NOT add an `environment:` key. It changes the OIDC `sub` claim; the IAM
# trust matches `repo:EdgeVector/schema-infra:ref:refs/heads/main` only.
on:
  workflow_run:
    workflows: [ci-required]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_teardown:
        description: "Type destroy-schema-service to run teardown."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: read
  checks: read

concurrency:
  group: schema-infra-teardown
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "152335099025"

jobs:
  prepare-oidc:
    name: prepare-oidc
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && inputs.confirm_teardown == 'destroy-schema-service')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/SchemaInfraDeployProd
          aws-region: us-east-1
      - name: Deploy OIDC stack with teardown permissions
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          cd cdk
          npm run build
          npx cdk deploy SchemaInfraOidcStack \
            --context environment=prod \
            --context identityOnly=true \
            --require-approval never

  teardown-dev:
    name: teardown-dev
    needs: prepare-oidc
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/SchemaInfraDeployDev
          aws-region: us-west-2
      - name: Tear down DEV and verify gone
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
        run: bash scripts/teardown-env.sh dev

  teardown-prod:
    name: teardown-prod
    needs: teardown-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/SchemaInfraDeployProd
          aws-region: us-east-1
      - name: Tear down PROD and verify gone
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
        run: bash scripts/teardown-env.sh prod
      - name: Remove SchemaInfraDeploy roles (keep shared OIDC provider)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
        run: bash scripts/teardown-oidc.sh
