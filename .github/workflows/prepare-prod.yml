name: Prepare PROD candidate

# Explicit preparation from accepted main. No public alias or canary change.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  id-token: write

concurrency:
  group: schema-infra-deploy
  cancel-in-progress: false

jobs:
  prepare-prod:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: schema-infra-prod-traffic
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - name: Require the accepted main CI and security results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          jq -e '.check_runs | map(select(.name == "ci-required")) | max_by(.started_at) | .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/checks.json"
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --limit 100 --json workflowName,status,conclusion,databaseId > "$RUNNER_TEMP/security.json"
          jq -e 'map(select(.workflowName == "CodeQL")) | max_by(.databaseId) | .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/security.json"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install and compile CDK
        run: npm ci && npm run build
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152335099025:role/SchemaInfraDeployProd
          aws-region: us-east-1
      - name: Deploy the reviewed qualified-read permission
        working-directory: cdk
        run: npx cdk deploy SchemaInfraOidcStack --context environment=prod --context identityOnly=true --require-approval never
      - name: Build the accepted core artifact in CI
        env:
          SCHEMA_ARTIFACT_STORE: ${{ runner.temp }}/artifacts
          SCHEMA_BUILD_REMOTE_HOST: ""
          BUILD_PROFILE: release
        run: |
          set -euo pipefail
          bash scripts/deploy/ensure-artifact.sh > "$RUNNER_TEMP/artifact-output"
          sed -n 's/^MANIFEST=/manifest=/p' "$RUNNER_TEMP/artifact-output" >> "$GITHUB_OUTPUT"
        id: artifact
      - name: Prepare the model layer
        env:
          SCHEMA_LAYER_CACHE: ${{ runner.temp }}/model-cache
        run: bash scripts/deploy/ensure-layer.sh
      - name: Publish and verify the separate numbered candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/prepare-prod-candidate.py --manifest "$CANDIDATE_MANIFEST" | tee "$RUNNER_TEMP/candidate-output"
          {
            echo '### Qualified PROD candidate; public traffic unchanged'
            echo '```text'
            tail -n 2 "$RUNNER_TEMP/candidate-output"
            echo '```'
            echo 'The definition retirement and traffic change require the next reviewed source change.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the source artifact for the rollout
        if: always() && steps.artifact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-prod-source-artifact
          path: ${{ runner.temp }}/artifacts
          retention-days: 14
          if-no-files-found: error
