name: ci-required

# Merge gate for schema-infra. Runs the CDK compile and the CDK synth tests plus
# the deploy-helper shell tests through .lastgit/ci.sh. This workflow NEVER
# deploys and holds no AWS credentials. Deploy workflows stay workflow_dispatch
# only (see .github/workflows/README.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Git identity for helper tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          test "${{ needs.test.result }}" = "success"
