name: ci-required

# Merge gate for schema-infra. Runs shell and Python syntax checks and the CDK compile
# through .lastgit/ci.sh. This repo has no tests (deleted 2026-10-09). This
# workflow NEVER deploys and holds no AWS credentials. Deploy is
# `.github/workflows/deploy.yml` (see `.github/workflows/README.md`).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          test "${{ needs.build.result }}" = "success"
