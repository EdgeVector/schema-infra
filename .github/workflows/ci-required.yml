name: ci-required

# Minimal merge gate for the retired schema-infra repo.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Retired repo gate
        run: |
          test -f README.md
          echo "schema-infra is retired; gate OK"

  ci-required:
    name: ci-required
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          test "${{ needs.build.result }}" = "success"
